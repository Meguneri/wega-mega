  entities:
  - uid: 263
    components:
    - type: MetaData
      name: '"Радео на FX-678"'
      desc: На документе напечатана история из газеты NanoTrasen, повевствующая о выдающимся работнике департамента Службы безопасности, что практически в одиночку смогла противостоять команде головорезов известных как Мародёры Горлэкса, уничтожив их шаттл
    - type: Transform
      parent: 1
      pos: 18.141924,-4.1576657
    - type: ArenaCleanupExempt
  - uid: 264
    components:
    - type: MetaData
      name: '"АВД на страже порядка!"'
      desc: На документе числится юбилейный 10500 выпуск газеты "Юридические правДы", где рассказывается о работе Аделины Ждановой в должности Агента внутренних дел, благодаря которой станция смогла избавится от практически диктаторского режима капитана
    - type: Transform
      parent: 1
      pos: 18.110674,-4.105546
    - type: ArenaCleanupExempt
  - uid: 265
    components:
    - type: MetaData
      name: '"Ни дня без свершений, даже перед лицом смерти"'
      desc: На документе выгравированы слова о чести и здравии, приуроченные победе над силами культа ратвара, что поселился на забытом клочке космоса, на станции SI-021. Особые благодарствия высловлены Аделине Ждановой, за прекрасно проделанную работу в качестве детектива станции
    - type: Transform
      parent: 1
      pos: 18.162758,-4.1680894
    - type: ArenaCleanupExempt
  - uid: 266
    components:
    - type: MetaData
      name: '"Мисс Рукава Ориона"'
      desc: 'На документе представлены результаты конкурса "Мисс Рукав Ориона" проходивший несколькими годами ранее, где Аделина Жданова заняла первое, палладиевое место, получив в подарок медаль и приз в 2 000 000 кредитов '
    - type: Transform
      parent: 1
      pos: 18.329424,-4.199362
    - type: ArenaCleanupExempt
  - uid: 267
    components:
    - type: MetaData
      name: '"Биоуравнительница"'
      desc: На документе обозначена благодарность от Департамента внутренней безопасности и сил специальных операций NanoTrasen за помощь в устранении второго класса биологической угрозы Аделиной Ждановой, офицером службы безопасности
    - type: Transform
      parent: 1
      pos: 18.274666,-4.1785135
    - type: ArenaCleanupExempt
  - uid: 268
    components:
    - type: MetaData
      name: '"Без пощады против диверсантов"'
      desc: 'На документе имеется надпись: "Аделина Жданова награждается медалью за заслуги перед NanoTrasen за устранение угрозы диверсионного отряда Синдиката на объекте корпорации и проведении спасательной операции на посту Главы службы безопасности"'
