# Вечная нерушимая стена из дыма для маппинга.
# Выглядит как дым (AdminInstantEffectSmoke), но: не издаёт звуков,
# не исчезает, не распространяется и непроходима.
- type: entity
  id: WallSmokeEternal
  suffix: Wega, Eternal
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    drawdepth: Effects
  - type: Occluder
  - type: Airtight
  - type: Tag
    tags:
    - Wall
