# Arena cyberpunk walls (Wega). Names carry the "(Arena)" suffix via localization.
# neon_tube, holo_barrier, circuit_panel, data_glass and bio_neon are animated
# (their RSI states declare per-frame delays; the engine plays them back
# automatically through IconSmooth, exactly like the existing hierophant wall).

- type: entity
  parent: BaseWall
  id: WallArenaNeonTube
  components:
  - type: Sprite
    sprite: _Wega/Structures/Walls/arena_cyberpunk/neon_tube.rsi
  - type: Icon
    sprite: _Wega/Structures/Walls/arena_cyberpunk/neon_tube.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: neon_tube
  - type: SyncedSpriteAnimation
  - type: PointLight
    radius: 3.0
    energy: 1.2
    color: "#2fe6ff"
    softness: 1
    castShadows: false

