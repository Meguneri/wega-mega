# Спавнеры скавов рейда. Ставятся при маппинге по локации. На базе RandomSpawner: при загрузке
# карты спавнят моба и самоудаляются. Тип дикого рандомизируется: обычный/забегун чаще,
# снайпер/тяжеловес — реже.

- type: entity
  id: RaidSkavSpawner
  parent: MarkerBase
  name: Raid Skav Spawner
  suffix: Raid
  description: Спавнит Дикого со случайным типом и снаряжением при загрузке карты рейда и самоудаляется.
  components:
  - type: Sprite
    layers:
      - state: red
  - type: RandomSpawner
    prototypes:
    - MobSkav
    - MobSkavRusher
    rarePrototypes:
    - MobSkavSniper
    - MobSkavHeavy
    rareChance: 0.25
    chance: 1
    deleteSpawnerAfterSpawn: true

- type: entity
  parent: RaidSkavSpawner
  id: RaidSkavBossSpawner
  name: Raid Skav Boss Spawner
  suffix: Raid, Boss
  description: Спавнит босса-скава при загрузке карты рейда. Ставь один-два на локацию.
  components:
  - type: RandomSpawner
    prototypes:
    - MobSkavBoss
    - MobSkavBossShotgun
    - MobSkavBossSMG
    chance: 1
    deleteSpawnerAfterSpawn: true
