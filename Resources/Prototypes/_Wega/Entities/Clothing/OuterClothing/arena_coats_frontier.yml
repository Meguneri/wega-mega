- type: entity
  parent: ClothingOuterCoatHoSTrench
  id: ClothingOuterCoatBHTrenchWega
  name: "bounty hunter's flak trenchcoat (Frontier Station)"
  description: A greatcoat enhanced with a bulletproof alloy for some extra protection and style for those with a charismatic presence.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Coats/bounty_hunter_coat.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Coats/bounty_hunter_coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.4
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.80

