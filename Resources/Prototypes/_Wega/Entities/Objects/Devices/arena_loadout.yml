- type: entity
  parent: CrateGeneric
  id: ArenaLoadoutCrate
  name: arena loadout crate
  suffix: Duel Arena
  description: A crate containing a pre-selected duel arena loadout. Its contents are removed after the round.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/secure.rsi
    layers:
    - state: base
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorage
    # Автоматически открывается, чтобы боец мог сразу забрать снаряжение.
    closeOnMapInit: false
    airtight: false
    # Небольшой запас прочности, но не вечный.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TimedDespawn
    # Если очистка арены по какой-то причине не сработает, ящик самоуничтожится через 5 минут.
    lifetime: 300

- type: entity
  parent: ComputerFrame
  id: ArenaLoadoutTerminal
  name: arena loadout terminal
  suffix: Duel Arena
  description: A terminal that lets duelists choose their arena loadout before the fight starts.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: comm_syndie
      shader: unshaded
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.ArenaLoadoutUiKey.Key
    requireHands: false
  - type: UserInterface
    interfaces:
      enum.ArenaLoadoutUiKey.Key:
        type: ArenaLoadoutBoundUserInterface
  - type: ArenaLoadoutTerminal
    loadouts:
    - ArenaLoadoutSniper
    - ArenaLoadoutHeavy
    - ArenaLoadoutMelee
    - ArenaLoadoutUplink
    - ArenaLoadoutHarpoon
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: ComputerFrame
    node: monitorFrame
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
