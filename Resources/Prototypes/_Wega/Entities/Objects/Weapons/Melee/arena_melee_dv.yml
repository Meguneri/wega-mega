- type: entity
  parent: Truncheon
  id: AdvancedTruncheonWega
  name: advanced truncheon (Delta-V)
  description: A longer, rigid, steel-studded baton, meant to harm more!
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/advanced_truncheon.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.75
    damage:
      types:
        Blunt: 22.5
    bluntStaminaDamageFactor: 1.60
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 7.5
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/advanced_truncheon.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage

- type: entity
  parent: BaseSword
  id: SilverSwordWega
  name: silver sword (Delta-V)
  description: A beautiful sword made almost entirely of silver. It's blade is dull and can't hold an edge, but it is still a solid blade.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/silversword.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
  - type: Item
    sprite: _Wega/Objects/Weapons/Melee/silversword.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
    - belt
