# Эффекты демонтажа стен арест-ботом.
# Звуки: Chequered Ink '400 Sounds Pack' (itch.io, бесплатный) —
# см. Resources/Audio/_Wega/Duel/breach/attributions.yml.

# Удары по преграде: два чередующихся металлических стука.
- type: soundCollection
  id: ArrestBotBreachHit
  files:
  - /Audio/_Wega/Duel/breach/metal_blunt_tap.ogg
  - /Audio/_Wega/Duel/breach/aluminium_can_place.ogg

# Искры от удара по преграде.
- type: entity
  id: EffectArrestBotBreachHit
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Effects/sparks.rsi
      state: sparks
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

# Облако пыли на месте рухнувшей преграды.
- type: entity
  id: EffectArrestBotWallCollapse
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.4
  - type: Sprite
    drawdepth: Effects
    noRot: true
    color: "#FFFFFFC0"
    layers:
    - sprite: Effects/chemsmoke.rsi
      state: chemsmoke
  - type: Tag
    tags:
    - HideContextMenu
