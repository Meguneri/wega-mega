# Снаряжение арестатора Синдиката: станнер и стан-дубинка в руках, наручники в карманах.
- type: startingGear
  id: SyndicateArresterGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitTurtleneckTactick
    head: ClothingHeadHelmetSwatSyndicate
    mask: ClothingMaskGasSyndicate
    eyes: ClothingEyesGlassesSniperThermalSyndie
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterVestWebElite
    shoes: ClothingShoesBootsJackSec
    pocket1: Handcuffs
    pocket2: Handcuffs
  inhand:
    - WeaponDisabler
    - Stunbaton

# Человек-арестатор на базе пехотинца Синдиката. Без боевого ИИ:
# стоит на месте и выполняет только приказы с пульта арестатора.
- type: entity
  parent: MobHuman
  id: MobSyndicateArrester
  name: syndicate escort
  description: A relentless Syndicate operative. On command he hunts down the target, stuns it, strips off its armor, cuffs it and escorts it to whoever gave the order before jumping away through bluespace.
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Loadout
    prototypes:
    - SyndicateArresterGear
  - type: InputMover
  - type: MobMover
  - type: ArrestBot
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.0
  # Corvax anti-overloot + уход в блюспейс после доставки цели.
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
    - BluespaceLifelineImplant
