# Босс босс-арены — бронированный босс ближнего И дальнего боя.
# Ближний бой — СОБСТВЕННОЕ (природное) MeleeWeapon, которое усиливается по фазам и от числа
# участников (см. BossArenaBossComponent/ApplyPhaseBuffs и BossArenaSystem/ApplyParticipantScaling —
# множители применяются к компоненту MeleeWeapon самого босса). Поэтому оружие ближнего боя в руки
# НЕ даём: иначе фаза-множители урона не работали бы.
# Дальний бой — привязанный пулемёт «Каратель» (WeaponBossArenaKara): только босс может поднять и
# стрелять из него; HTN (BossArenaCompound) выбирает атаку по дистанции до цели. Запасные короба
# в сумке, перезарядка — RaidSkavAutoReload. Урон пуль фазами НЕ скейлится (и не должен).
- type: startingGear
  id: BossArenaGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorDarkGreen
    outerClothing: ClothingOuterArmorBulletproof
    head: ClothingHeadHelmetBasic
    mask: ClothingMaskGas
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsCombat
    back: ClothingBackpackDuffel
  inhand:
    - WeaponBossArenaKara
  storage:
    back:
    - MagazineLightRifleBox
    - MagazineLightRifleBox

- type: entity
  parent: MobHuman
  id: MobBossArena
  name: Арена-босс
  description: Могучий воин, охраняющий арену. Становится сильнее по мере получения урона.
  components:
  - type: NpcFactionMember
    factions:
    - RaidBoss
  # Броня и одежда: раньше босс спавнился голым MobHuman. Оружие в руки не кладём (см. шапку файла).
  - type: Loadout
    prototypes:
    - BossArenaGear
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: MobThresholds
    thresholds:
      0: Alive
      400: PreCritical
      500: Critical
      600: Dead
  # Без гиббинга (перекрываем Destructible из BaseMob пустым списком): труп босса убирает сама
  # арена, а гиб ронял бы привязанный пулемёт и снаряжение на пол и спамил ошибками флинга
  # «виртуального предмета» второй руки от двуручного пулемёта.
  - type: Destructible
    thresholds: []
  # Природный удар босса. Базовый урон масштабируется по фазам (phaseDamageMultipliers: 1.0/1.2/1.5).
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 25
    altDisarm: false
  - type: BossArenaBoss
    phaseThresholds:
    - 0.66
    - 0.33
    phaseSpeedMultipliers:
    - 1.0
    - 1.2
    - 1.5
    phaseDamageMultipliers:
    - 1.0
    - 1.2
    - 1.5
  # BossArenaCompound: охраняет точку (без блуждания) и выбирает атаку по дистанции до цели:
  # рядом — природный MeleeWeapon (скейлится по фазам), далеко — привязанный пулемёт.
  - type: HTN
    rootTask:
      task: BossArenaCompound
  # Меткость босса: заметно лучше диких, но не лазерная — под огнём остаётся шанс уворачиваться.
  - type: RaidSkavAccuracy
    accuracyDegrees: 10
    shootDelay: 0.25
    rotationSpeedDegrees: 90
  # Перезаряжается из запасных коробов в сумке.
  - type: RaidSkavAutoReload
  # Огнестрел — очередями по 3–5 выстрелов с кулдауном, а не постоянно (см. BossArenaCompound).
  - type: BossArenaVolley
