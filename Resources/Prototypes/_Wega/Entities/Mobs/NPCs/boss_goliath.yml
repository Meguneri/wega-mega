# Арена-босс «Голиаф» — тяжёлый рыцарь в духе DS3 (Вордт/Гундир). Медленный танк в перекрашенном
# сапёрном скафандре (dev/gen_goliath_gear.py) с молотом. Дарксоулс-петля: телеграфированный чардж
# (в стену = стаггер, ×2 урона — окно наказания), телеграфированный АоЕ-слэм с нокдауном, на фазе 2
# морозный след за чарджем (GoliathBossSystem). Фазы/ярость/HP-бар/скейл от участников — штатный
# каркас босс-арены (BossArenaSystem): спавнить через трекер BossArenaTrackerGoliath.
#
# Молот у Голиафа В РУКЕ (перекрывает природное меле): фазовый множитель урона применяет к молоту
# сам GoliathBossSystem.SyncPhase — штатный ApplyPhaseBuffs скейлит только природное MeleeWeapon.

- type: startingGear
  id: GoliathBossGear
  equipment:
    outerClothing: ClothingOuterSuitGoliath
    head: ClothingHeadHelmetGoliath
    mask: ClothingMaskGasAtmos
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsCombat
  inhand:
    - WeaponGoliathHammer

- type: entity
  parent: ClothingOuterSuitBomb
  id: ClothingOuterSuitGoliath
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Suits/goliath.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Suits/goliath.rsi
  # Тяжёлая рыцарская плита: почти глуха к пулям и осколкам, но носитель медлителен.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.5
        Heat: 0.6

- type: entity
  parent: ClothingHeadHelmetBombSuit
  id: ClothingHeadHelmetGoliath
  components:
  - type: Sprite
    sprite: _Wega/Clothing/Head/Helmets/goliath.rsi
  - type: Clothing
    sprite: _Wega/Clothing/Head/Helmets/goliath.rsi

- type: entity
  parent: Sledgehammer
  id: WeaponGoliathHammer
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/goliath_hammer.rsi
  - type: Item
    sprite: _Wega/Objects/Weapons/Melee/goliath_hammer.rsi
  # Медленный сокрушительный удар; урон скейлится по фазам (GoliathBossSystem.SyncPhase).
  - type: MeleeWeapon
    attackRate: 0.6
    range: 1.6
    damage:
      types:
        Blunt: 28

- type: entity
  parent: MobHuman
  id: MobBossGoliath
  suffix: Boss Arena
  components:
  - type: NpcFactionMember
    factions:
    - RaidBoss
  - type: Loadout
    prototypes:
    - GoliathBossGear
  - type: RandomHumanoidAppearance
    randomizeName: false
  # Танк: живучесть выше чемпиона; итог ещё скейлится от числа участников (BossArenaSystem).
  - type: MobThresholds
    thresholds:
      0: Alive
      550: PreCritical
      650: Critical
      750: Dead
  # Без гиббинга: труп убирает арена; гиб ронял бы снаряжение и спамил ошибками (см. чемпиона).
  - type: Destructible
    thresholds: []
  # Медленный: игрок обгоняет его пешком — дистанцию Голиаф сокращает ЧАРДЖЕМ, а не бегом.
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.7
  # Природное меле — запасной вариант, если молот выбит из рук (фазовый скейл штатный).
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20
    altDisarm: false
  - type: BossArenaBoss
    phaseThresholds:
    - 0.5
    phaseSpeedMultipliers:
    - 1.0
    - 1.2
    phaseDamageMultipliers:
    - 1.0
    - 1.3
  - type: GoliathBoss
  # Обычное преследование между атаками; спецатаки поверх ведёт GoliathBossSystem.
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

# Трекер босс-арены с Голиафом: ставится на карту вместо (или рядом с) BossArenaTracker.
# Голиаф — дуэльный босс без миньонов; 5 минут на бой, дальше ярость.
- type: entity
  parent: BossArenaTracker
  id: BossArenaTrackerGoliath
  suffix: Boss Arena (Goliath)
  components:
  - type: BossArena
    scanRange: 200
    scanInterval: 0.5
    returnGrace: 20
    bossPrototype: MobBossGoliath
    minionPrototypes: []
    maxFightDuration: 300
    healthScaleBase: 0.75
    healthScalePerParticipant: 0.25
    damageScalePerParticipant: 0.1
