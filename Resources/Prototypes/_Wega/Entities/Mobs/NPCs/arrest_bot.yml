- type: entity
  parent: MobSiliconBase
  id: MobArrestBot
  name: арест-бот
  description: Безжалостный автоматический охранник. По команде преследует нарушителя, оглушает его, надевает наручники и доставляет к начальству.
  components:
  - type: Sprite
    sprite: Mobs/Silicon/Bots/supplybot.rsi
    state: supplybot
  - type: NPCSteering
  - type: Puller
    needsHands: false
  - type: ArrestBot
    arrestRange: 1.2
    stunDuration: 4
    moveSpeed: 3.5
    actionCooldown: 1
    timeout: 60
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: InteractionPopup
    interactSuccessString: petting-success-supplybot
    interactFailureString: petting-failure-supplybot
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Vocalizer
  - type: DatasetVocalizer
    dataset: SecBotAds
  - type: MeleeWeapon
    attackRate: 1
    hidden: true
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 5
