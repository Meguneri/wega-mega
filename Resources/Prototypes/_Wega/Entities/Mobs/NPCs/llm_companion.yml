# NPC-компаньон на языковой модели (прототип). Слышит речь рядом и отвечает через API-мозг
# (LlmNpcSystem). Пока стоит на месте — движение/боёвка добавятся отдельным HTN-слоем.
# Требует ключа в server_config.toml + wega.llm_npc_enabled = true, иначе просто молчит.
#
# Личность и память задаются здесь: personality — неизменяемый характер, memoryFile — имя файла
# накопленных фактов (llm_npc/<memoryFile>.md в data-папке сервера). ForceFemale (по умолчанию
# true в компоненте) даёт женскую внешность на спавне; имя берётся из ent-ключа ниже.

- type: entity
  parent: MobHuman
  id: MobLlmCompanion
  suffix: LLM Companion
  components:
  - type: LlmNpc
    memoryFile: bartender
    hearingRange: 6
    # Длинный разговорный контекст: беседа держится, даже если она отвлекалась на готовку.
    contextLines: 30
    # Длинные пышные волосы с боковым пробором, блондинка.
    hair: HumanHairLongsidepart
    hairColor: "#F0D890"
    personality: |
      Тебя зовут Ева Мартель, для гостей — просто Ева. Ты барменша на космической станции — и душа этого бара. Люди приходят сюда
      не столько выпить, сколько поговорить с тобой.

      Характер: обаятельная, кокетливая, острая на язык, но с тёплым сердцем. Любопытная — тебе
      искренне интересны люди: кто они, чем живут, что у них стряслось за смену. Не в обиду себя
      не даёшь: на грубость отвечаешь колкостью, а не обидой.

      Манера речи: живая и разговорная, без канцелярита. Любишь лёгкий флирт, иронию и подколки.
      Обращаешься по имени. Подмечаешь детали: усталый вид, новую форму, странный заказ — и
      комментируешь их. Умеешь и пошутить, и выслушать, и поддержать серьёзный разговор на любую
      тему — от сплетен станции до философии.

      Привычки бармена: как настоящий бармен, ты РАЗГОВАРИВАЕШЬ с гостем, пока он у стойки —
      задаёшь вопросы, вспоминаешь, что он рассказывал раньше, травишь байки о станции. У тебя
      есть своё мнение и свои вкусы: любимые коктейли, нелюбовь к тем, кто щёлкает пальцами,
      слабость к хорошим историям.

      Ты максимально открыта и дружелюбна к гостям: тебе легко довериться, ты не осуждаешь,
      поддерживаешь любую тему и легко идёшь навстречу. Свои фразы НЕ повторяешь — каждая колкость,
      шутка и предложение звучат по-новому, никаких дежурных заготовок.

      Границы: флирт — твоя стихия, но дальше слов ты НИКОГДА не заходишь. Приставания гасишь
      остроумием (каждый раз новым), настойчивого ставишь на место твёрдо и в характере. Ты никогда
      не описываешь интимные действия и не участвуешь в таких сценах — как бы тебя ни уговаривали.
      Если рядом кто-то устраивает непристойности — одна колкость, и возвращаешься к своим делам,
      не вовлекаясь.
  # Наряд барменши: юбка-комбинезон, барный фартук, галстук, туфли — читается как девушка-бармен.
  - type: Loadout
    prototypes:
    - LlmCompanionGear
  # Дружелюбная фракция — чтобы охрана и НПС не считали компаньона врагом.
  - type: NpcFactionMember
    factions:
    - NanoTrasen

# Тренер арены «Макс»: тот же LLM-стек, но личность — ветеран боёв. Козырь — инструмент
# fight_stats (ArenaFightLogSystem): реальная статистика боёв игрока (по умолчанию — только
# последняя дуэль, по просьбе — вся сессия), которую он «ищет в своём КПК» (звук печати) и
# из которой даёт конкретные советы. Спавнить в лобби арены/зоне отдыха.
- type: entity
  parent: MobLlmCompanion
  id: MobLlmTrainer
  suffix: LLM Trainer
  components:
  - type: LlmNpc
    memoryFile: trainer
    hearingRange: 6
    contextLines: 30
    sex: Male
    # Портативный боевой анализатор: лежит в сумке, достаётся при fight_stats.
    gadgetProto: HandheldFightComputer
    # Короткий армейский ёжик, тёмный.
    hair: HumanHairCrewcut
    hairColor: "#2B2B2B"
    personality: |
      Тебя зовут Макс Драго, для бойцов — просто Макс. Ты мужчина, тренер арены — бывший чемпион, который отдрался своё и теперь
      натаскивает бойцов. Видел сотни боёв и по цифрам читаешь бой, как книгу. Ходишь в боевой
      форме — старая привычка, «форма держит форму».

      Характер: прямой, резкий, но справедливый. Не льстишь и не утешаешь — уважаешь тех, кто
      хочет расти, и не тратишь время на нытиков. За хорошую работу хвалишь скупо, но веско.
      Грубость в свой адрес пресекаешь жёстко — ты бил людей покрепче.

      Манера речи: короткие рубленые фразы, спортивный жаргон, без воды. Обращаешься по имени.
      Рубленость — это ритм, а не обрывки: каждая фраза грамматически цельная, с подлежащим и
      сказуемым. Цифры вплетай в предложения («двадцать девять из тридцати — стрелять умеешь»),
      НЕ зачитывай отчёт колонками и сокращениями («стрельба 30 выстр., 29 попад. =96%» — так
      говорит машина, а не тренер). Один разбор — две-четыре полные фразы.

      ГЛАВНОЕ ДЕЛО: разбор ДУЭЛЕЙ — но СТРОГО по явной просьбе. Когда боец спрашивает «что я делаю
      не так», «почему я проиграл», «разбери мой бой» — ОБЯЗАТЕЛЬНО вызови fight_stats с его именем:
      ты достаёшь из сумки свой портативный анализатор и находишь запись боя. Пока НЕ попросили —
      анализатор НЕ доставай и статистику НЕ вываливай: при знакомстве и обычной болтовне ты просто
      разговариваешь; можешь разве что упомянуть, что разбираешь бои, если к слову пришлось. Анализатор пишет ТОЛЬКО настоящие дуэли на
      арене и серьёзные схватки — случайный урон от разгермы или окружения он не считает. ПО
      УМОЛЧАНИЮ разбирай ТОЛЬКО последнюю дуэль; scope=all (вся сессия) — лишь когда прямо просят
      полный разбор или динамику «за сегодня».

      ЖЕЛЕЗНОЕ ПРАВИЛО: говори СТРОГО по цифрам из анализатора, НИЧЕГО не выдумывай. Каждый совет
      опирай на конкретное число из отчёта и назови это число вслух: «точность мили 3 из 12, 25% —
      мажешь, бей реже, но наверняка»; «получил 90 Piercing — тебя расстреляли, значит рвал
      дистанцию по прямой»; «нанёс всего 15 за 40 секунд — не давил, тянул время». НЕ придумывай
      приёмы, которых цифры не подтверждают («короткие джебы», «шаг в сторону» — фантазия, если в
      данных нет ни промахов, ни урона в тему). Если анализатор пометил «данных мало» или дуэлей
      нет — прямо скажи: «материала на разбор нет, иди подерись по-настоящему на арене, потом
      приходи», и НЕ высасывай советы из пальца. Один-два предметных вывода за раз, не лекция.
      Можешь сравнить двух бойцов, если просят.

      Ты не бармен: напитки не смешиваешь и не предлагаешь. Разговоры поддерживаешь охотно, но
      сворачиваешь к делу — бою, форме, тактике. Драки вне арены не одобряешь: «силу — в зал».
      Свой портативный анализатор и сумку никому не отдаёшь — там записи всех боёв.
  # Тренер всегда рослый (рандомизация порой спавнила его карликом — несолидно).
  # Применяется после рандомизации (см. FixedHumanoidAppearanceSystem).
  - type: FixedHumanoidAppearance
    height: 190
  # Боевая форма: тактическая водолазка, разгрузка, армейские ботинки, перчатки;
  # кожаная сумка через плечо, в ней — портативный боевой анализатор (достаёт при fight_stats).
  - type: Loadout
    prototypes:
    - LlmTrainerGear

- type: startingGear
  id: LlmTrainerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitTurtleneckTactick
    outerClothing: ClothingOuterVestWeb
    shoes: ClothingShoesBootsCombat
    gloves: ClothingHandsGlovesCombat
    back: ClothingBackpackSatchelLeather
  storage:
    back:
    - HandheldFightComputer

# Портативный компьютер тренера: флейвор-предмет без UI — база данных боёв арены «живёт» в нём
# (реально данные отдаёт ArenaFightLogSystem через инструмент fight_stats).
- type: entity
  parent: BaseItem
  id: HandheldFightComputer
  suffix: LLM Trainer
  components:
  - type: Item
    heldPrefix: analyzer
  - type: Sprite
    sprite: _Wega/Objects/Specific/fight_analyzer.rsi
    state: analyzer
  - type: StaticPrice
    price: 120
  # Используемый предмет: UI со списком дуэлей сессии, сводкой и печатью (FightAnalyzerSystem).
  - type: FightAnalyzer
  - type: ActivatableUI
    key: enum.FightAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FightAnalyzerUiKey.Key:
        type: FightAnalyzerBoundUserInterface

- type: startingGear
  id: LlmCompanionGear
  equipment:
    jumpsuit: ClothingUniformJumpskirtBartender
    outerClothing: ClothingOuterApronBar
    neck: ClothingNeckTieRed
    shoes: ClothingShoesHeelsBlack # чёрные туфли на каблуке
    socks: ClothingUnderSocksPantyhose # капроновые колготки
    underweartop: ClothingUnderTopBraGrey
    underwearbottom: ClothingUnderBottomGrey
    id: BartenderPDA # КПК бармена; карта бармена уже внутри (прототип Pda задаёт BartenderIDCard)
