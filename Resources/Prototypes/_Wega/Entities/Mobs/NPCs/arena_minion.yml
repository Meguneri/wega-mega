- type: entity
  id: ArenaLoserMinion
  name: миньон затаённой обиды
  description: Крошечный дрон, который помогает бойцу, проигравшему слишком много дуэлей подряд. Следует за хозяином и подлечивает его. Не атакует.
  parent: BaseSimpleMob
  save: false
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Wega/Mobs/arena_loser_minion.rsi
    layers:
    - state: blue
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 10
        # hard: true — иначе ProjectileSystem.OnStartCollide отбрасывает попадание по мягкой
        # фикстуре (!OtherFixture.Hard), снаряды летят сквозь дрон, и его броня/порог разрушения
        # ниже — мёртвый код. Слой — ТОЛЬКО BulletImpassable, не FlyingMobLayer: тот включает
        # Opaque, и твёрдый дрон, вися у раненого владельца, ломал Opaque-рейкасты (LOS,
        # досягаемость ближних атак по владельцу) — лечащий дрон превращался в щит.
        # Маска пустая: сам дрон ни за что не цепляется при полёте.
        hard: true
        mask: []
        layer:
        - BulletImpassable
  # Металлический корпус: режет холодное/пулевое, чуть держит удары. Раньше дрон падал с одного
  # выстрела, потому что не имел брони.
  - type: Damageable
    damageModifierSet: Metallic
  # Разрушается при накоплении урона. Порог поднят с 30 до 90 — с бронёй это ~3-4 попадания,
  # а не «с одного выстрела».
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 90
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ArenaLoserMinion
    actionCooldown: 2.5
    followRadius: 2
    healThreshold: 0.5
    healAmount: 10
    moveSpeed: 6.5
  - type: TimedDespawn
    lifetime: 300
  - type: Tag
    tags:
    - CannotSuicide
    - StunImmune
