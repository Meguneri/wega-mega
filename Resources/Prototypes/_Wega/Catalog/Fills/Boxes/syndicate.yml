- type: entity
  id: BorgKit
  parent: [BoxCardboard, BaseSyndicateContraband]
  name: cyborg Kit
  suffix: Filled
  components:
    - type: Sprite
      layers:
        - state: box_of_doom
    - type: StorageFill
      contents:
        - id: ReinforcementRadioSyndicateCyborgAssault
        - id: ModuleSyndiWeapon
        - id: ModuleSyndiSupport
        - id: Screwdriver

# Anti-materiel ammo kit for Bauer127 — ported from lust-station/_Sunrise
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: AntimaterialAmmoKit
  name: antimaterial magazine kit
  description: "Contains a full set of Bauer127 magazines: standard, penetrator, frag, blast, and EMP."
  components:
  - type: StorageFill
    contents:
    - id: MagazineBauer127
      amount: 2
    - id: MagazineBauer127Penetrator
    - id: MagazineBauer127Frag
    - id: MagazineBauer127Blast
    - id: MagazineBauer127Emp

- type: entity
  id: SyndiBarmenKit
  parent: [BoxCardboard, BaseSyndicateContraband]
  name: syndi barmen Kit
  description: The Syndicate's Young Bartender's Kit consists of six Syndi-shakers for the entire company.
  components:
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: vials
  - type: Storage
    grid:
    - 0,0,5,2
  - type: StorageFill
    contents:
    - id: DrinkShakerSyndi
      amount: 6
