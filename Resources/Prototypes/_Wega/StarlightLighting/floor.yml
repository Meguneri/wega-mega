- type: entity
  id: WegaStarlightLightFloorEmpty
  suffix: Empty
  parent: WegaStarlightPoweredFloorLightEmpty
  components:
    - type: Sprite
      sprite: _Wega/StarlightLighting/light_floor.rsi
      drawdepth: FloorTiles
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: light_open
        - map: ["enum.PoweredLightLayers.Glow"]
          state: light_open_bulb_glow
          shader: unshaded
          visible: false
        - map: ["enum.WegaStarlightLightFloorLayers.Cover"]
          state: light_off
          visible: false
        - map: ["enum.WegaStarlightLightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
          visible: false
      state: light_open
    - type: Construction
      graph: WegaStarlightLightFloor
      node: lightFloor
    - type: PoweredLightVisuals
      spriteStateMap:
        empty: light_open
        off: light_open_bulb
        on: light_open_bulb
        broken: light_open_bulb_broken
        burned: light_open_bulb_burned
    - type: WiresPanel
      open: true
    - type: WegaStarlightLightFloor
    - type: Physics
      canCollide: false

- type: entity
  id: WegaStarlightLightFloor
  suffix: ""
  parent: WegaStarlightLightFloorEmpty
  components:
    - type: Sprite
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: light_open_bulb
        - map: ["enum.PoweredLightLayers.Glow"]
          state: light_open_bulb_glow
          shader: unshaded
          visible: false
        - map: ["enum.WegaStarlightLightFloorLayers.Cover"]
          state: light_off
        - map: ["enum.WegaStarlightLightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
          visible: false
    - type: PointLight
      enabled: true
    - type: PoweredLight
      hasLampOnSpawn: LightBulb
    - type: WiresPanel
      open: false

- type: entity
  id: WegaStarlightFloorTileItemLight
  parent: FloorTileItemBase
  components:
    - type: Sprite
      sprite: _Wega/StarlightLighting/light_floor.rsi
      state: tile
    - type: Item
      sprite: Objects/Tiles/tile.rsi
    - type: FloorTile
      outputs:
        - Plating
    - type: Stack
      stackType: WegaStarlightFloorTileLight
    - type: Construction
      graph: WegaStarlightLightFloor
      node: lightTile
    - type: SpawnAfterInteract
      prototype: WegaStarlightLightFloorEmpty
      doAfter: 0.5
      removeOnInteract: true

- type: stack
  parent: BaseTileStack
  id: WegaStarlightFloorTileLight
  name: wega-starlight-stack-light-tile
  icon: { sprite: /Textures/_Wega/StarlightLighting/light_floor.rsi, state: tile }
  spawn: WegaStarlightFloorTileItemLight

- type: entity
  id: WegaStarlightLightFloorAlwaysPowered
  suffix: Always Powered
  parent: WegaStarlightFloorLight
  components:
    - type: Sprite
      sprite: _Wega/StarlightLighting/light_floor.rsi
      drawdepth: FloorTiles
      layers:
        - map: ["enum.WegaStarlightLightFloorLayers.Cover"]
          state: light_off
        - map: ["enum.WegaStarlightLightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
      state: light_off
    - type: Appearance
    - type: WegaStarlightLightFloor
    - type: PointLight
      radius: 4
      energy: 1.5
    - type: Physics
      canCollide: false

