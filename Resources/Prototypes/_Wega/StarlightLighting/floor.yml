# Starlight fff9583f6280f260d4df3c3a60318131feb54a87; см. README.md и LICENSE*.txt.
- type: entity
  id: WegaStarlightFloorLight
  suffix: Always Powered
  parent: BaseStructure
  components:
    - type: Sprite
      sprite: _Wega/StarlightLighting/floorlights.rsi
      snapCardinals: false
      drawdepth: FloorObjects
      noRot: true
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: base
        - map: ["enum.PoweredLightLayers.Glow"]
          state: glow
          shader: unshaded
      state: base
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.1
          density: 100
          mask:
            - None
          layer:
            - TabletopMachineLayer
    - type: PointLight
      radius: 10
      energy: 2.5
      softness: 0.9
      color: "#FFE4CE"
    - type: InteractionOutline
    - type: Damageable
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 1
            - !type:EmptyAllContainersBehaviour
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: StaticPrice
      price: 75
    - type: RequireProjectileTarget

- type: entity
  id: WegaStarlightPoweredFloorLightEmpty
  suffix: Empty
  parent: WegaStarlightFloorLight
  components:
    - type: Sprite
      state: empty
    - type: PointLight
      enabled: false
    - type: PoweredLight
      bulb: Bulb
    - type: ContainerContainer
      containers:
        light_bulb: !type:ContainerSlot
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SmartLight
    - type: DeviceLinkSink
      ports:
        - On
        - Off
        - Toggle
    - type: Construction
      graph: WegaStarlightFloorLightFixture
      node: floorLight
    - type: Appearance
    - type: PoweredLightVisuals
      blinkingSound:
        path: "/Audio/Machines/light_tube_on.ogg"
      spriteStateMap:
        empty: empty
        off: base
        on: base
        broken: broken
        burned: burned
    - type: DamageOnInteract
      damage:
        types:
          Heat: 2
      popupText: powered-light-component-burn-hand

- type: entity
  id: WegaStarlightPoweredFloorLight
  suffix: ""
  parent: WegaStarlightPoweredFloorLightEmpty
  components:
    - type: Sprite
      state: base
    - type: PointLight
      enabled: true
    - type: PoweredLight
      hasLampOnSpawn: LightBulb
    - type: AmbientOnPowered
    - type: AmbientSound
      volume: -15
      range: 3
      sound:
        path: /Audio/Ambience/Objects/light_hum.ogg

- type: entity
  id: WegaStarlightPoweredFloorLightLed
  suffix: LED
  parent: WegaStarlightPoweredFloorLight
  components:
    - type: PointLight
      enabled: true
      radius: 8
      energy: 1
      softness: 1
      color: "#EEEEFF"
    - type: PoweredLight
      hasLampOnSpawn: LedLightBulb
    - type: DamageOnInteract
      damage:
        types:
          Heat: 1
      popupText: powered-light-component-burn-hand

- type: entity
  id: WegaStarlightPoweredFloorLightWarm
  suffix: Warm
  parent: WegaStarlightPoweredFloorLight
  components:
    - type: PointLight
      enabled: true
      radius: 6
      energy: 1
      softness: 3
      color: "#FF8A0C"
    - type: PoweredLight
      hasLampOnSpawn: WarmLightBulb

- type: entity
  id: WegaStarlightPoweredFloorLightDim
  suffix: Dim
  parent: WegaStarlightPoweredFloorLight
  components:
    - type: PointLight
      enabled: true
      radius: 5
      energy: 0.5
      softness: 3
      color: "#ba473f"
    - type: PoweredLight
      hasLampOnSpawn: DimLightBulb
    - type: DamageOnInteract
      damage:
        types:
          Heat: 1
      popupText: powered-light-component-burn-hand

