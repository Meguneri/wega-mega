- type: markingsGroup
  parent: None
  id: Orc
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOrc
  categories: [ HideSpawnMenu ]
  name: orc appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganOrcTorso
      Head: OrganOrcHead
      ArmLeft: OrganOrcArmLeft
      ArmRight: OrganOrcArmRight
      HandRight: OrganOrcHandRight
      HandLeft: OrganOrcHandLeft
      LegLeft: OrganOrcLegLeft
      LegRight: OrganOrcLegRight
      FootLeft: OrganOrcFootLeft
      FootRight: OrganOrcFootRight
      Tongue: OrganHumanTongue
      Ears: OrganHumanEars
      Appendix: OrganHumanAppendix
      Brain: OrganHumanBrain
      Eyes: OrganOrcEyes
      Heart: OrganAnimalHeart
      Lungs: OrganHumanLungs
      Stomach: OrganOrcStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Orc
    height: 226.5
    voice: UnisexOrc
  - type: Inventory
    speciesId: orc
    displacements:
      jumpsuit: &orcDisplacement
        sizeMaps:
          32:
            sprite: _Wega/Mobs/Species/Orc/displacement.rsi
            state: body
      outerClothing: *orcDisplacement
      head: *orcDisplacement
      mask: *orcDisplacement
      eyes: *orcDisplacement
      ears: *orcDisplacement
      gloves: *orcDisplacement
      shoes: *orcDisplacement
      neck: *orcDisplacement
      back: *orcDisplacement
      suitstorage: *orcDisplacement
      belt: *orcDisplacement
      socks: *orcDisplacement
      underwearbottom: *orcDisplacement
      underweartop: *orcDisplacement

- type: entity
  parent:
  - AppearanceOrc
  - BaseSpeciesMobOrganic
  - BaseOperated
  id: MobOrc
  name: Urist McHands The Orc
  save: false
  components:
  - type: OrcAccent
  - type: Injurable
    damageContainer: Biological
  - type: Icon
    sprite: _Wega/Mobs/Species/Orc/parts.rsi
    state: full
  - type: Sprite
    scale: 1.2, 1.2
  - type: Fixtures  # Aavikko: larger hitbox for orc (scale 1.2)
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.42  # Aavikko: bigger than human (0.35), fits through doors
        density: 250  # Aavikko: heavier than human (185)
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.0001
  - type: ThermalRegulator
    metabolismHeat: 600
    radiatedHeat: 100
    implicitHeatRegulation: 5000
    sweatHeatRegulation: 5000
    shiveringHeatRegulation: 1000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 25
  - type: Temperature
    temperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 0
    coldDamage:
      types:
        Cold: 1
    heatDamage:
      types:
        Heat: 1.5
  - type: PassiveDamage # Orcs have more slower regen and have radiation regen
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.05
        Blunt: -0.03
        Piercing: -0.03
        Slash: -0.03
        Radiation: -0.15
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: MeleeWeapon # Orcs have massive, but more slow attacks
    hidden: true
    attackRate: 0.8
    damage:
      types:
        Blunt: 10
  - type: MovementSpeedModifier # Orcs are slower
    baseWalkSpeed : 2.3
    baseSprintSpeed : 4.3
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Critical
      200: Dead
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Vocal
    emoteSounds: UnisexOrc
  - type: Speech
    speechSounds: Bass

- type: entity
  parent: OrganBaseOrganic
  id: OrganOrc
  abstract: true
  suffix: Orc

- type: entity
  id: OrganOrcMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [Animal] # Совместимость с нашими реагентами еды/напитков.
    groups:
    - id: Food
    - id: Drink

- type: entity
  parent: OrganOrc
  id: OrganOrcInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi # Человеческая текстура пока что

- type: entity
  parent: OrganOrc
  id: OrganOrcExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Species/Orc/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Wega/Mobs/Species/Orc/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Orc

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganOrcExternal ]
  id: OrganOrcTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganOrcExternal ]
